<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  .canvas {
    width: 720px; height: 720px; position: relative; overflow: hidden;
    background: radial-gradient(circle at 50% 42%, #FFFFFF 0%, #F0F4F8 55%, #DCE6F0 100%);
  }
  .glow {
    position: absolute; left: 50%; top: 50%; width: 520px; height: 520px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(0, 212, 255, 0.16) 0%, rgba(0, 212, 255, 0) 65%);
  }
  .floor {
    position: absolute; left: 50%; top: 548px; width: 330px; height: 34px;
    transform: translateX(-50%);
    background: radial-gradient(ellipse, rgba(21, 43, 71, 0.30) 0%, rgba(21, 43, 71, 0) 70%);
  }
  .icon {
    position: absolute; left: 50%; top: 50%; height: 460px;
    transform: translate(-50%, -50%);
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="glow"></div>
    <div class="floor"></div>
    <img class="icon" src="icon-hires.png" alt="">
  </div>
</body>
</html>
