<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
  html, body { margin: 0; }
  .canvas {
    width: 1640px; height: 624px; position: relative; overflow: hidden;
    font-family: 'Heebo', sans-serif; color: #FFFFFF;
    background: linear-gradient(120deg, #152B47 0%, #1E3A5F 50%, #152B47 100%);
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(0, 212, 255, 0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 212, 255, 0.07) 1px, transparent 1px);
    background-size: 48px 48px;
    -webkit-mask-image: radial-gradient(ellipse at 50% 100%, #000 0%, rgba(0,0,0,0.35) 55%, transparent 80%);
  }
  .glow {
    position: absolute; left: 420px; top: 220px; width: 800px; height: 520px;
    background: radial-gradient(ellipse, rgba(0, 212, 255, 0.18) 0%, rgba(0, 212, 255, 0) 65%);
  }

  /* Facebook mobile shows only x=265..1375, and the profile picture sits over the bottom center (about x=660..980, y>330) */
  .head { position: absolute; left: 0; right: 0; top: 46px; text-align: center; direction: rtl; }
  .logo { display: block; width: 400px; margin: 0 auto 22px; }
  h1 { margin: 0 0 10px; font-weight: 800; font-size: 44px; line-height: 1.15; letter-spacing: -0.5px; }
  .sub { margin: 0; font-weight: 400; font-size: 24px; color: #B9C8DB; }
  .sub b { color: #00D4FF; font-weight: 700; }

  .shot {
    position: absolute; top: 312px; width: 350px; height: 250px; border-radius: 16px; overflow: hidden;
    box-shadow: 0 24px 50px rgba(0, 0, 0, 0.45);
    border: 2px solid rgba(255, 255, 255, 0.14);
  }
  .shot img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .shot.model { left: 285px; }
  .shot.model img { transform: scale(1.18); transform-origin: 48% 52%; }
  .shot.ai { left: 1005px; border-color: rgba(0, 212, 255, 0.55); }
  .shot.ai img { object-position: 48% 50%; }
  .tag {
    position: absolute; top: 12px; right: 12px; padding: 5px 14px; border-radius: 999px;
    background: rgba(21, 43, 71, 0.86); color: #FFFFFF; font-weight: 700; font-size: 17px; direction: rtl;
  }
  .arrow { position: absolute; left: 760px; top: 300px; width: 120px; height: 40px; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="grid"></div>
    <div class="glow"></div>

    <div class="head">
      <img class="logo" src="logo-wide.png" alt="AnyCloset 3D">
      <h1>הדמיית ארונות בתלת-ממד, ישר מהדפדפן</h1>
      <p class="sub">תכנון, תמחור ושיתוף חי עם הלקוח · <b>שבוע ניסיון חינם, בלי כרטיס אשראי</b></p>
    </div>

    <div class="shot model"><img src="sample-3d.jpg" alt=""><span class="tag">מודל תלת-ממדי</span></div>
    <div class="shot ai"><img src="ai-01.jpg" alt=""><span class="tag">הדמיית AI</span></div>
    <svg class="arrow" viewBox="0 0 120 40" fill="none" stroke="#00D4FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 20 H 108" />
      <path d="M94 8 L 110 20 L 94 32" />
    </svg>
  </div>
</body>
</html>
