<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>מוקאפ 3D — פלטת ציר ארון</title>
  <style>
    html, body { margin: 0; height: 100%; background: #e8eaed; overflow: hidden; font-family: system-ui, sans-serif; }
    #c { display: block; width: 100%; height: 100%; }
    .label {
      position: fixed; top: 16px; right: 16px; color: #111;
      background: rgba(255,255,255,.85); padding: 10px 14px; border-radius: 8px; font-size: 14px;
      max-width: 280px; line-height: 1.35; z-index: 2; box-shadow: 0 2px 10px rgba(0,0,0,.12);
    }
    .label strong { display: block; font-size: 16px; margin-bottom: 4px; }
  </style>
</head>
<body>
  <div class="label">
    <strong>מודל 3D — פלטת ציר ארון</strong>
    לפי תמונת הייחוס · גיאומטריה מוחלטת (לא תמונה)
  </div>
  <canvas id="c"></canvas>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setClearColor(0xe8eaed, 1);
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(28, 1, 0.1, 100);

    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const key = new THREE.DirectionalLight(0xffffff, 1.1);
    key.position.set(6, 5, 4);
    scene.add(key);
    const fill = new THREE.DirectionalLight(0xffffff, 0.5);
    fill.position.set(-3, 2, -4);
    scene.add(fill);
    scene.add(new THREE.HemisphereLight(0xffffff, 0xb0a090, 0.4));

    const mat = new THREE.MeshStandardMaterial({ color: 0xdfe3e8, metalness: 0.72, roughness: 0.32 });

    function plateShape() {
      const s = new THREE.Shape();
      const sw = 0.58, r = 0.32;
      s.moveTo(sw, -2.45);
      s.absarc(0, -2.45, sw, 0, Math.PI, true);
      s.lineTo(-sw, 0.22);
      s.quadraticCurveTo(-sw, 0.48, -sw - 0.35, 0.55);
      s.lineTo(-1.72, 0.62);
      s.quadraticCurveTo(-2.08, 0.66, -2.08, 0.66 + r);
      s.lineTo(-2.08, 1.72);
      s.quadraticCurveTo(-2.08, 2.08, -2.08 + r, 2.08);
      s.lineTo(-sw - 0.28, 2.12);
      s.quadraticCurveTo(-sw, 2.16, -sw, 2.42);
      s.lineTo(-sw, 2.45);
      s.absarc(0, 2.45, sw, Math.PI, 0, true);
      s.lineTo(sw, -0.22);
      s.quadraticCurveTo(sw, -0.48, sw + 0.35, -0.55);
      s.lineTo(1.72, -0.62);
      s.quadraticCurveTo(2.08, -0.66, 2.08, -0.66 - r);
      s.lineTo(2.08, -1.72);
      s.quadraticCurveTo(2.08, -2.08, 2.08 - r, -2.08);
      s.lineTo(sw + 0.28, -2.12);
      s.quadraticCurveTo(sw, -2.16, sw, -2.45);
      const h1 = new THREE.Path();
      h1.absarc(-1.35, 1.28, 0.32, 0, Math.PI * 2, true);
      s.holes.push(h1);
      const h2 = new THREE.Path();
      h2.absarc(1.35, -1.28, 0.32, 0, Math.PI * 2, true);
      s.holes.push(h2);
      return s;
    }

    function buildPlate() {
      const g = new THREE.Group();
      const baseDepth = 0.16;
      const geo = new THREE.ExtrudeGeometry(plateShape(), {
        depth: baseDepth, bevelEnabled: true, bevelThickness: 0.03,
        bevelSize: 0.035, bevelSegments: 2, curveSegments: 10
      });
      geo.rotateY(-Math.PI / 2);
      geo.translate(baseDepth / 2 + 0.02, 0, 0);
      g.add(new THREE.Mesh(geo, mat));
      const rail = new THREE.Mesh(new THREE.BoxGeometry(0.28, 4.55, 0.72), mat);
      rail.position.set(baseDepth + 0.16, 0, 0);
      g.add(rail);
      return g;
    }

    const plate = buildPlate();
    plate.scale.setScalar(1.8);
    scene.add(plate);

    // Soft ground shadow disc
    const shadow = new THREE.Mesh(
      new THREE.CircleGeometry(4.5, 32),
      new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.08 })
    );
    shadow.rotation.x = -Math.PI / 2;
    shadow.position.set(0, -3.2, 0);
    scene.add(shadow);

    function resize() {
      const w = innerWidth, h = innerHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    addEventListener('resize', resize);
    resize();

    let t = 0;
    function tick() {
      t += 0.008;
      const a = 0.15 + Math.sin(t) * 0.22;
      camera.position.set(Math.cos(a) * 16, 1.2, Math.sin(a) * 16);
      camera.lookAt(0.2, 0, 0);
      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }
    tick();
  </script>
</body>
</html>
